<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="BorsFlow">
  <!-- The header logo, geometry for geometry: a w-8 plate with rounded-lg
       (1rem in this project, so on 32px it is a full circle), a w-4 lucide
       "layers" glyph centred at half the plate's size, stroke 2. Plate is
       --n-text and glyph --n-base, so it flips with the colour scheme the same
       way the header mark flips with the site theme. -->
  <style>
    .plate { fill: #0d0e15; }
    .mark  { stroke: #f7f7fa; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #f5f5f7; }
      .mark  { stroke: #0a0b0e; }
    }
  </style>
  <circle class="plate" cx="16" cy="16" r="16" />
  <g
    class="mark"
    fill="none"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(8 8) scale(0.6667)"
  >
    <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" />
    <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" />
    <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" />
  </g>
</svg>
