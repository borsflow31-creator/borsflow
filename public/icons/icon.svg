<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="BorsFlow">
  <!-- The header logo (lucide "layers" on a rounded plate), sized for a 16px tab.
       The plate inverts with the browser chrome the same way the header mark
       inverts with the site theme, so it never sinks into the tab bar. -->
  <style>
    .plate { fill: #0d0e15; }
    .mark  { stroke: #f5f5f7; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #f5f5f7; }
      .mark  { stroke: #0d0e15; }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="7" />
  <g
    class="mark"
    fill="none"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(6.4 6.4) scale(0.8)"
  >
    <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" />
    <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" />
    <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" />
  </g>
</svg>
